# Szerkesztőfelület beállításai
# GitHub-tároló: gaborw88/tarsasjatek-hirek
backend:
  name: github
  repo: gaborw88/tarsasjatek-hirek
  branch: main

media_folder: public/images/uploads
public_folder: /images/uploads

collections:
  - name: hirek
    label: Hírek
    label_singular: Cikk
    folder: src/content/hirek
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{status}}  ·  {{title}}  ·  {{date | date('YYYY.MM.DD')}}"
    sortable_fields: [date, publishedAt, title]
    view_filters:
      - label: "⏳ Tervezet (szerkesztőre vár)"
        field: status
        pattern: "tervezet"
      - label: "👀 Főszerkesztőre vár"
        field: status
        pattern: "főszerkesztőre"
      - label: "✅ Megjelent"
        field: status
        pattern: "megjelent"
      - label: "Hírösszefoglalók"
        field: type
        pattern: gyujtott
      - label: "Fordítások"
        field: type
        pattern: forditas
      - label: "Saját cikkek"
        field: type
        pattern: sajat
      - label: "Videóajánlók"
        field: type
        pattern: video
    fields:
      - name: status
        label: "Állapot"
        widget: string
        required: false
        default: "⏳ tervezet"
        readonly: true
        hint: "Mentés után kb. 1 perc alatt frissül (ha nem látod, töltsd újra az oldalt)."
      - name: approved
        label: "✅ Szerkesztő: jóváhagyom, kész a megjelenésre"
        widget: boolean
        default: false
      - name: chiefApproved
        label: "👑 Főszerkesztő: jóváhagyom"
        widget: boolean
        default: false
      - name: published
        widget: hidden
        default: false
      - name: publishedAt
        label: "Jóváhagyás dátuma"
        widget: datetime
        date_format: "YYYY.MM.DD"
        time_format: "HH:mm"
        required: false
        readonly: true
      - name: lastEditedBy
        label: "Utoljára szerkesztette"
        widget: string
        required: false
        readonly: true
      - name: approvedBy
        label: "Szerkesztőként jóváhagyta"
        widget: string
        required: false
        readonly: true
      - name: chiefApprovedBy
        label: "Főszerkesztőként jóváhagyta"
        widget: string
        required: false
        readonly: true
      - name: title
        label: Cím
        widget: string
      - name: description
        label: Rövid összefoglaló (bevezető)
        widget: text
        hint: "1–2 mondat. Ez látszik a főoldalon és a megosztásoknál."
      - name: date
        label: "Beérkezés dátuma"
        widget: datetime
        date_format: "YYYY.MM.DD"
        time_format: "HH:mm"
      - name: type
        label: Cikk típusa
        widget: select
        default: sajat
        hint: "Fordítást csak az eredeti kiadó vagy szerző engedélyével szabad közzétenni!"
        options:
          - { label: "Saját cikk", value: sajat }
          - { label: "Fordítás", value: forditas }
          - { label: "Hírösszefoglaló (automatikus gyűjtés)", value: gyujtott }
          - { label: "Videóajánló", value: video }
      - name: author
        label: Szerző
        widget: string
        required: false
        hint: "Ha üres, „Szerkesztőség” jelenik meg."
      - name: tags
        label: Témák / címkék
        widget: list
        default: []
        hint: "Pl.: Magyar megjelenések, Gémklub, Essen Spiel, Kickstarter, Díjak"
      - name: youtube
        label: YouTube-videó linkje
        widget: string
        required: false
        hint: "Ha megadod, a videó a cikk tetején jelenik meg (a borítókép helyett)."
      - name: image
        label: Borítókép
        widget: image
        required: false
        hint: "Csak olyan képet tölts fel, amit szabad használni (saját fotó, kiadói sajtókép)."
      - name: imageAlt
        label: Képaláírás / kép leírása
        widget: string
        required: false
      - name: imageCredit
        label: Kép forrása
        widget: string
        required: false
        hint: "Megjelenik a kép alatt. Pl.: „Fotó: Gémklub sajtóanyag” vagy „Fotó: saját”"
      - name: imageSuggestion
        label: "💡 Javasolt kép (csak szerkesztőknek, nem jelenik meg)"
        widget: text
        required: false
        hint: "A hírgyűjtő ide írja, hol található hivatalos sajtókép. Ha rendben van, töltsd le, töltsd fel a Borítókép mezőbe, és töltsd ki a Kép forrása mezőt."
      - name: sources
        label: Források
        label_singular: Forrás
        widget: list
        required: false
        default: []
        fields:
          - { name: name, label: "Forrás neve", widget: string }
          - { name: url, label: "Link", widget: string }
      - name: body
        label: Szöveg
        widget: markdown

  - name: oldalak
    label: "📄 Oldalak"
    description: "Az oldal fix aloldalai. A mentés után néhány percen belül megjelennek – ezeket csak a főszerkesztő módosíthatja."
    files:
      - name: rolunk
        label: "Rólunk"
        file: src/content/oldalak/rolunk.md
        fields: &oldal_mezok
          - { name: title, label: "Cím", widget: string }
          - { name: lede, label: "Bevezető (nagyobb betűvel, a cím alatt)", widget: text, required: false }
          - { name: body, label: "Szöveg", widget: markdown }
      - name: impresszum
        label: "Impresszum"
        file: src/content/oldalak/impresszum.md
        fields: *oldal_mezok
      - name: adatkezeles
        label: "Adatkezelési tájékoztató"
        file: src/content/oldalak/adatkezeles.md
        fields: *oldal_mezok

  - name: beallitasok
    label: "⚙️ Beállítások"
    files:
      - name: szerkesztok
        label: "Szerkesztők"
        file: szerkesztok.yml
        description: "Csak a főszerkesztő módosíthatja – más mentését a rendszer automatikusan visszaállítja."
        fields:
          - name: szerkesztok
            label: Szerkesztők
            label_singular: Szerkesztő
            widget: list
            summary: "{{nev}} ({{github}})"
            fields:
              - { name: nev, label: "Név", widget: string }
              - { name: github, label: "GitHub-felhasználónév", widget: string, hint: "Pontosan úgy, ahogy a GitHubon szerepel." }
              - { name: githubNev, label: "Név a GitHub-profilban (ha eltér)", widget: string, required: false, hint: "Ha a szerkesztő a GitHub-profiljában más nevet adott meg, mint a fenti Név, ide írd be pontosan." }
              - name: szerep
                label: "Szerep"
                widget: select
                default: szerkeszto
                options:
                  - { label: "Szerkesztő", value: szerkeszto }
                  - { label: "Főszerkesztő", value: foszerkeszto }
              - name: ellenorzesNelkul
                label: "Ellenőrzés nélkül publikálhat"
                widget: boolean
                default: false
                hint: "Bekapcsolva a szerkesztő által jóváhagyott cikk azonnal kimegy, főszerkesztői jóváhagyás nélkül."
