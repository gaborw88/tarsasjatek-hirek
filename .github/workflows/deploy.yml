# Automatikus közzététel: minden mentés után újraépül és frissül az oldal
name: Oldal közzététele

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          check-latest: true
          cache: npm
      - run: npm ci
      # Kétlépcsős jóváhagyás: állapotok frissítése és visszaírása
      - name: Jóváhagyási állapotok
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          out=$(node scripts/jovahagyas.mjs); echo "$out"
          if echo "$out" | grep -q VALTOZOTT; then
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add -A src/content/hirek src/content/oldalak szerkesztok.yml
            git commit -m "Jóváhagyási állapotok frissítése" || exit 0
            # Ha közben újabb mentés érkezett: a legfrissebb állapotra újra lefuttatjuk, nem fésüljük össze
            for i in 1 2 3 4 5; do
              git push -q origin HEAD:main && break
              git fetch -q origin main && git reset -q --hard origin/main
              out=$(AFTER=HEAD node scripts/jovahagyas.mjs); echo "$out"
              echo "$out" | grep -q VALTOZOTT || break
              git add -A src/content/hirek src/content/oldalak szerkesztok.yml
              git commit -q -m "Jóváhagyási állapotok frissítése" || break
              sleep 3
            done
            # Biztonsági ellenőrzés: összefésülési jelek nem kerülhetnek az oldalba
            ! grep -rl '^<<<<<<< ' src szerkesztok.yml
          fi
      - run: npm run build
        env:
          # Saját domain: dobjektiv.hu
          SITE_URL: https://dobjektiv.hu
          BASE_PATH: /
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
